<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Asante & Grove</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="index.html">Asante&nbsp;&amp;&nbsp;Grove <small>Est. Registry No. 0119</small></a>
    <nav class="nav-links">
      <a href="index.html" data-i18n="nav.home">Home</a>
      <a href="listings.html" data-i18n="nav.listings">Listings</a>
      <a href="agents.html" data-i18n="nav.agents">Agents</a>
      <a href="about.html" data-i18n="nav.history">Our History</a>
      <a href="reviews.html" data-i18n="nav.reviews">Reviews</a>
      <a href="contact.html" data-i18n="nav.contact">Contact</a>
    </nav>
    <button class="nav-toggle" aria-label="Toggle menu">☰</button>
  </div>
</header>

<section class="center">
  <div class="wrap" style="display:flex; justify-content:center;">
    <form class="form-card" id="login-form">
      <span class="eyebrow">Account</span>
      <h2 style="margin-top:10px; font-size:1.8rem;" data-i18n="login.heading">Sign in</h2>
      <div class="field mt-lg"><label for="l-email" data-i18n="common.email">Email</label><input id="l-email" type="email" required></div>
      <div class="field"><label for="l-pass" data-i18n="common.password">Password</label><input id="l-pass" type="password" required></div>
      <button class="btn block" type="submit" data-i18n="common.sign_in">Sign in</button>
      <p style="font-size:0.86rem; color:var(--ink-soft); margin-top:16px;"><span data-i18n="login.new_here">New here?</span> <a class="text-link" href="signup.html" data-i18n="common.create_account">Create an account</a></p>
    </form>
  </div>
</section>

<footer><div class="wrap foot-bottom"><span>© <span data-year></span> Asante &amp; Grove Real Estate</span></div></footer>

<script type="module" src="js/firebase-config.js"></script>
<script type="module" src="js/main.js"></script>
<script type="module">
  import { login } from "./js/auth.js";
  import { showToast } from "./js/main.js";

  document.getElementById("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    try {
      await login(document.getElementById("l-email").value, document.getElementById("l-pass").value);
      location.href = "dashboard.html";
    } catch (err) {
      showToast("Sign in failed — check your email and password.");
    }
  });
</script>
</body>
</html>
