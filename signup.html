<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create account — Asante & Grove</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="index.html">Asante&nbsp;&amp;&nbsp;Grove <small>Est. Registry No. 0119</small></a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="listings.html">Listings</a>
      <a href="agents.html">Agents</a>
      <a href="reviews.html">Reviews</a>
      <a href="contact.html">Contact</a>
    </nav>
    <button class="nav-toggle" aria-label="Toggle menu">☰</button>
  </div>
</header>

<section class="center">
  <div class="wrap" style="display:flex; justify-content:center;">
    <form class="form-card" id="signup-form">
      <span class="eyebrow">Account</span>
      <h2 style="margin-top:10px; font-size:1.8rem;">Create account</h2>
      <div class="field mt-lg"><label for="s-name">Full name</label><input id="s-name" required></div>
      <div class="field"><label for="s-email">Email</label><input id="s-email" type="email" required></div>
      <div class="field"><label for="s-phone">Phone</label><input id="s-phone"></div>
      <div class="field"><label for="s-pass">Password</label><input id="s-pass" type="password" minlength="6" required></div>
      <button class="btn block" type="submit">Create account</button>
      <p style="font-size:0.86rem; color:var(--ink-soft); margin-top:16px;">Already registered? <a class="text-link" href="login.html">Sign in</a></p>
    </form>
  </div>
</section>

<footer><div class="wrap foot-bottom"><span>© <span data-year></span> Asante &amp; Grove Real Estate</span></div></footer>

<script type="module" src="js/firebase-config.js"></script>
<script type="module" src="js/main.js"></script>
<script type="module">
  import { signup } from "./js/auth.js";
  import { showToast } from "./js/main.js";

  document.getElementById("signup-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    try {
      await signup(
        document.getElementById("s-name").value,
        document.getElementById("s-email").value,
        document.getElementById("s-pass").value,
        document.getElementById("s-phone").value
      );
      location.href = "dashboard.html";
    } catch (err) {
      showToast("Could not create account — email may already be in use.");
    }
  });
</script>
</body>
</html>
