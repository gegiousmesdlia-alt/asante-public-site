<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Listing — Asante & Grove</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="index.html">Asante&nbsp;&amp;&nbsp;Grove <small>Est. Registry No. 0119</small></a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="listings.html">Listings</a>
      <a href="agents.html">Agents</a>
      <a href="contact.html">Contact</a>
      <span id="auth-slot" style="display:contents"></span>
    </nav>
    <button class="nav-toggle" aria-label="Toggle menu">☰</button>
  </div>
</header>

<section id="listing-root">
  <div class="wrap empty-state">Loading listing…</div>
</section>

<footer>
  <div class="wrap foot-bottom">
    <span>© <span data-year></span> Asante &amp; Grove Real Estate</span>
    <a href="listings.html">← Back to listings</a>
  </div>
</footer>

<!-- BTC payment modal -->
<div id="btc-modal" style="display:none; position:fixed; inset:0; background:rgba(20,23,28,0.6); z-index:80; align-items:center; justify-content:center; padding:20px;">
  <div style="background:var(--paper); max-width:420px; width:100%; padding:30px; border:1px solid var(--line);">
    <span class="eyebrow">Bitcoin payment</span>
    <h3 style="margin-top:10px;">Booking fee</h3>
    <div id="btc-body" style="margin-top:18px; font-family:var(--font-mono); font-size:0.85rem;">Preparing invoice…</div>
    <button class="btn outline block" id="btc-close" style="margin-top:20px;">Close</button>
  </div>
</div>

<script type="module" src="js/firebase-config.js"></script>
<script type="module" src="js/main.js"></script>
<script type="module" src="js/auth.js"></script>
<script type="module">
  import { fetchListing } from "./js/listings.js";
  import { toggleFavorite } from "./js/favorites.js";
  import { createBtcPayment, pollBtcPayment } from "./js/payment-btc.js";
  import { formatUSD, plotCode, showToast } from "./js/main.js";
  import { auth } from "./js/firebase-config.js";

  const id = new URLSearchParams(location.search).get("id");
  const root = document.getElementById("listing-root");

  if (!id) {
    root.innerHTML = `<div class="wrap empty-state">No listing specified. <a class="text-link" href="listings.html">Browse all listings →</a></div>`;
  } else {
    try {
      const l = await fetchListing(id);
      if (!l) throw new Error("not found");
      document.getElementById("page-title").textContent = `${l.title} — Asante & Grove`;
      const imgs = l.images && l.images.length ? l.images : ["https://placehold.co/900x600/E2D8C3/14171C?text=No+Photo"];
      root.innerHTML = `
        <div class="wrap">
          <span class="plot-code">${plotCode(l.id)}</span>
          <div class="section-head" style="margin-top:8px;">
            <div>
              <span class="badge">${l.listingType === "rent" ? "For rent" : "For sale"}</span>
              <h1 style="font-size:clamp(1.8rem,3.6vw,3rem); margin-top:10px;">${l.title}</h1>
              <p style="color:var(--ink-soft); margin-top:8px;">${l.location || ""}</p>
            </div>
            <button class="btn outline" id="fav-btn">☆ Save</button>
          </div>

          <div class="two-col">
            <div>
              <img src="${imgs[0]}" alt="${l.title}" style="border:1px solid var(--line); aspect-ratio:4/3; object-fit:cover; width:100%;">
              <div class="grid" style="grid-template-columns:repeat(3,1fr); gap:10px; margin-top:10px;">
                ${imgs.slice(1,4).map(src => `<img src="${src}" style="border:1px solid var(--line); aspect-ratio:4/3; object-fit:cover;">`).join("")}
              </div>
              <h3 style="margin-top:34px; text-transform:none; font-family:var(--font-body); font-weight:600;">About this property</h3>
              <p style="color:var(--ink-soft); margin-top:10px; line-height:1.7;">${l.description || "No description provided yet."}</p>

              <div class="ledger-card" style="margin-top:26px;">
                <div class="row"><span>Bedrooms</span><span>${l.beds ?? "–"}</span></div>
                <div class="row"><span>Bathrooms</span><span>${l.baths ?? "–"}</span></div>
                <div class="row"><span>Size</span><span>${l.sizeSqm ? l.sizeSqm + " m²" : "–"}</span></div>
                <div class="row"><span>Title status</span><span>${l.titleStatus || "Verified"}</span></div>
                <div class="row"><span>Plot code</span><span>${plotCode(l.id)}</span></div>
              </div>
            </div>

            <div>
              <div class="form-card" style="max-width:none;">
                <div class="plot-price" style="border:none; padding:0;">
                  <span class="amount" style="font-size:1.5rem;">${formatUSD(l.price || 0)}${l.listingType === "rent" ? "/yr" : ""}</span>
                  <span class="btc">₿ accepted</span>
                </div>
                <p style="color:var(--ink-soft); font-size:0.88rem; margin-top:10px;">Agent: ${l.agentName || "Assigned on booking"}</p>

                <div class="field" style="margin-top:20px;">
                  <label for="visit-name">Full name</label>
                  <input id="visit-name" type="text" placeholder="Your name" required>
                </div>
                <div class="field">
                  <label for="visit-email">Email</label>
                  <input id="visit-email" type="email" placeholder="you@email.com" required>
                </div>
                <div class="field">
                  <label for="visit-date">Preferred viewing date</label>
                  <input id="visit-date" type="date">
                </div>

                <button class="btn block" id="book-btn">Book a viewing</button>
                <button class="btn outline block" id="pay-btc-btn" style="margin-top:10px;">Pay booking fee in BTC</button>
                <p style="font-size:0.76rem; color:var(--ink-soft); margin-top:10px;">A refundable booking fee of ${formatUSD((l.bookingFeeUsd || 50))} confirms a slot with the agent. USD equivalent settled in BTC.</p>
              </div>
            </div>
          </div>
        </div>
      `;

      document.getElementById("fav-btn").addEventListener("click", () => toggleFavorite(l.id));
      document.getElementById("book-btn").addEventListener("click", () => {
        const name = document.getElementById("visit-name").value;
        const email = document.getElementById("visit-email").value;
        if (!name || !email) { showToast("Add your name and email first."); return; }
        showToast("Viewing request sent — the agent will confirm by email.");
      });

      document.getElementById("pay-btc-btn").addEventListener("click", async () => {
        const email = document.getElementById("visit-email").value;
        if (!email) { showToast("Add your email before paying."); return; }
        const modal = document.getElementById("btc-modal");
        const body = document.getElementById("btc-body");
        modal.style.display = "flex";
        body.textContent = "Preparing invoice…";
        try {
          const pay = await createBtcPayment({
            listingId: l.id,
            amountUsd: l.bookingFeeUsd || 50,
            purpose: "booking_fee",
            email
          });
          body.innerHTML = `
            <img src="${pay.qrCodeUrl}" alt="BTC payment QR code" style="width:180px; height:180px; margin:0 auto 16px; display:block; border:1px solid var(--line);">
            <div class="ledger-card">
              <div class="row"><span>Send exactly</span><span>${pay.btcAmount} BTC</span></div>
              <div class="row"><span>To address</span><span style="word-break:break-all;">${pay.btcAddress}</span></div>
              <div class="row"><span>Status</span><span id="btc-status">waiting for payment</span></div>
            </div>`;
          pollBtcPayment(pay.paymentId, (data) => {
            const statusEl = document.getElementById("btc-status");
            if (statusEl) statusEl.textContent = data.status;
            if (data.status === "finished") showToast("Payment confirmed — booking secured.");
          });
        } catch {
          body.innerHTML = `Could not create a BTC invoice. This requires the /api/create-btc-payment serverless function to be deployed with a NOWPAYMENTS_API_KEY set.`;
        }
      });

      document.getElementById("btc-close").addEventListener("click", () => {
        document.getElementById("btc-modal").style.display = "none";
      });
    } catch (e) {
      root.innerHTML = `<div class="wrap empty-state">Listing not found. <a class="text-link" href="listings.html">Browse all listings →</a></div>`;
    }
  }
</script>
</body>
</html>
